<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Signature Catering by 1314 — Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F1E3;--ink:#12301F;--mute:#4F6556;--accent:#A3231B;--panel:#EBE2CC;--line:#12301F55;--bar:#F7F1E3EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F2A1B;--ink:#F4ECD8;--mute:#A9BBA9;--accent:#EBAE38;--panel:#173826;--line:#F4ECD855;--bar:#0F2A1BEE}}
:root[data-theme="dark"]{--bg:#0F2A1B;--ink:#F4ECD8;--mute:#A9BBA9;--accent:#EBAE38;--panel:#173826;--line:#F4ECD855;--bar:#0F2A1BEE}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif}
header{padding:56px 22px 36px;max-width:980px;margin:0 auto}
h1{font:700 clamp(46px,12vw,104px)/.92 Fraunces,Georgia,serif;margin:0;letter-spacing:-.02em;font-variation-settings:"opsz" 144}
.by{font:italic 500 clamp(22px,5vw,34px)/1.2 Fraunces,Georgia,serif;color:var(--accent);margin:10px 0 0}
.sub{margin:22px 0 0;color:var(--mute);max-width:46ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);backdrop-filter:blur(8px);border-block:1px solid var(--line)}
nav div{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;max-width:980px;margin:0 auto;scrollbar-width:none}
nav a{flex:none;color:var(--ink);text-decoration:none;font-weight:500;font-size:14px;padding:6px 13px;border-radius:99px;border:1px solid var(--line)}
nav a:hover,nav a:focus-visible{background:var(--ink);color:var(--bg);outline:none}
main{max-width:980px;margin:0 auto;padding:8px 22px 72px}
section{padding:44px 0 8px}
section.f{background:var(--panel);margin:36px -22px 0;padding:36px 22px 22px}
h2{font:700 clamp(32px,7vw,48px)/1 Fraunces,Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
.note{margin:0 0 18px;color:var(--mute);font-size:14px;font-style:italic}
ul{list-style:none;margin:18px 0 0;padding:0}
@media(min-width:760px){ul{column-count:2;column-gap:56px}section.f{margin-inline:-40px;padding-inline:40px;border-radius:4px}}
li{break-inside:avoid;padding:0 0 18px}
.r{display:flex;align-items:baseline;gap:10px}
.n{font:500 19px/1.25 Fraunces,Georgia,serif}
.r i{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.p{font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
li p{margin:3px 0 0;color:var(--mute);font-size:14.5px;line-height:1.45;max-width:44ch}
footer{max-width:980px;margin:0 auto;padding:8px 22px 56px;color:var(--mute);font-size:14px}
footer b{font:italic 500 22px Fraunces,Georgia,serif;color:var(--ink);display:block;margin-bottom:4px}
</style>
</head>

<body>

];
var slug=function(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-")};
var nav="",out="";
M.forEach(function(c){
nav+='<a href="#'+slug(c[0])+'">'+c[0]+'</a>';
out+='<section id="'+slug(c[0])+'"'+(c[3]?' class="f"':'')+'><h2>'+c[0]+'</h2>'+(c[1]?'<p class="note">'+c[1]+'</p>':'')+'<ul>';

});
document.getElementById("nav").innerHTML=nav;

</html>
